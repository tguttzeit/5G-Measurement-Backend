[project]
name = "5g-measurement-backend"
version = "1.0.0"
description = "Backend for the 5G-Measurement-Software field-logging device"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "fastapi-users[sqlalchemy,all]>=12.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "httpx2>=2.10",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
