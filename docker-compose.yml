version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: 5gm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: measurement_backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: 5gm_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # For development: mount source code for hot reload
      - ./app:/app/app:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend_network
    restart: unless-stopped

  # React Frontend (Development mode with Vite)
  frontend:
    image: node:20-alpine
    container_name: 5gm_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - backend_network
    profiles:
      - dev

  # React Frontend (Production build with nginx)
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: 5gm_frontend_prod
    depends_on:
      - backend
    networks:
      - backend_network
    restart: unless-stopped
    profiles:
      - prod

  # Caddy Reverse Proxy (Production)
  caddy:
    image: caddy:2-alpine
    container_name: 5gm_caddy
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DOCS_DIR:-./docs-site}:/srv/docs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend-prod
    networks:
      - backend_network
    restart: unless-stopped
    profiles:
      - prod

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend_network:
    driver: bridge
